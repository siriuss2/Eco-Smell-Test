<app-header></app-header>

<div class="container mt-5">
    <div class="row">
      <!-- Filter Sidebar -->
      <div class="col-md-3 filterDiv">
        <h5 class="fw-bold mb-4">Филтер:</h5>
        <div class="form-group mb-4">
            <h6 class="text-uppercase mb-3">Колекции</h6>
            <div class="form-check fancy-checkbox">
                <input class="form-check-input" type="checkbox" value="Панда Колекција" id="pandaKolekcija" (change)="toggleCategory('Панда Колекција')">
                <label class="form-check-label" for="pandaKolekcija">
                    Панда Колекција
                </label>
            </div>
            <div class="form-check fancy-checkbox my-2">
                <input class="form-check-input" type="checkbox" value="Летна Колекција" id="letnaKolekcija" (change)="toggleCategory('Летна Колекција')">
                <label class="form-check-label" for="letnaKolekcija">
                    Летна Колекција
                </label>
            </div>
            <div class="form-check fancy-checkbox my-2">
                <input class="form-check-input" type="checkbox" value="Велигденска Колекција" id="veligdenskaKolekcija" (change)="toggleCategory('Велигденска Колекција')">
                <label class="form-check-label" for="veligdenskaKolekcija">
                    Велигденска Колекција
                </label>
            </div>
            <div class="form-check fancy-checkbox my-2">
                <input class="form-check-input" type="checkbox" value="Пролетна Колекција" id="proletnaKolekcija" (change)="toggleCategory('Пролетна Колекција')">
                <label class="form-check-label" for="proletnaKolekcija">
                    Пролетна Колекција
                </label>
            </div>
            <div class="form-check fancy-checkbox my-2">
                <input class="form-check-input" type="checkbox" value="Self Love Колекција" id="selfLoveKolekcija" (change)="toggleCategory('Self Love Колекција')">
                <label class="form-check-label" for="selfLoveKolekcija">
                    Self Love Колекција
                </label>
            </div>
            <div class="form-check fancy-checkbox">
                <input class="form-check-input" type="checkbox" value="Follow Your Heart Колекција" id="followYourHeartKolekcija" (change)="toggleCategory('Follow Your Heart Колекција')">
                <label class="form-check-label" for="followYourHeartKolekcija">
                    Follow Your Heart Колекција
                </label>
            </div>
        </div>
    </div>
    

  
      <!-- Product Listing -->
      <div class="col-md-9 mt-4 mt-md-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>Продукти</h2>
          <!-- <div class="d-flex align-items-center">
            <span class="me-2">Сортирај по:</span>
            <select class="form-select w-auto" aria-label="Sort by" (change)="selectSortOption($event)">
              <option value="best-selling"></option>
              <option value="lowest-to-highest">Цена: Најниска кон највисока</option>
              <option value="highest-to-lowest">Цена: Највисока кон најниска</option>
            </select>
            <span class="ms-3">{{ filteredProducts.length }} продукти</span>
          </div> -->
        </div>
  
        <div class="row">
          <div class="col-lg-4 col-md-4 col-sm-6 mb-4" *ngFor="let product of filteredProducts">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-img-container">
                <img src="{{ product.image }}" class="card-img-top img-fluid" alt="{{ product.name }}" style="height: 408px;">
              </div>
              <div class="card-body">
                <h6 class="card-title">{{ product.category }}</h6>
                <div class="d-flex align-items-center mb-2">
                  <span class="text-warning me-2">★★★★★</span>
                </div>
                <p class="card-text">{{ product.price }} ден.</p>
        
                <!-- Quantity Selector -->
                <div class="mb-3 col-6 d-flex align-items-center">
                  <label for="quantity-{{ product.id }}" class="form-label me-2">Количина:</label>
                  <input 
                    type="number" 
                    class="form-control text-center p-0 quantityInput" 
                    id="quantity-{{ product.id }}" 
                    [(ngModel)]="product.quantity" 
                    min="1" 
                    value="1">
                </div>
        
                <button 
                  class="btn btn-gradient w-100 btn-fancy" 
                  (click)="addToCart(product)">
                  Додади во кошничка
                </button>
              </div>
            </div>
          </div>
        </div>
        
        
        
        <!-- Pagination Controls -->
        <nav aria-label="Page navigation example">
          <ul class="pagination d-flex justify-content-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="changePage(currentPage - 1)">&laquo;</a>
            </li>
            <li class="page-item" 
                *ngFor="let page of [].constructor(totalPages); let i = index" 
                [class.active]="i + 1 === currentPage">
              <a class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="changePage(currentPage + 1)">&raquo;</a>
            </li>
          </ul>
        </nav>
        
      </div>
    </div>
  </div>


  <!-- Notification divs -->
<div *ngIf="showNotification" class="notification">
  Продуктот е додаден во кошничка!
</div>

<div *ngIf="showErrorNotification" class="notification-error">
  Се појави грешка!
</div>
  
  

<app-footer></app-footer>
