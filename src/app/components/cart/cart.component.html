<app-header></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-5">Кошничка</h2>
  
  <!-- Cart Items Section -->
  <div *ngIf="cartItems.length > 0; else emptyCart">
    <div class="row">
      <!-- Cart Items -->
      <div class="col-md-4 mb-4" *ngFor="let item of cartItems">
        <div class="card shadow-sm h-100">
          <img src="{{ item.image }}" class="card-img-top" alt="{{ item.name }}">
          <div class="card-body">
            <h5 class="card-title">{{ item.category }}</h5>
            <p class="card-text text-muted">{{ item.price }} ден.</p>
            
            <!-- Display Quantity -->
            <p class="card-text">Количина: {{ item.quantity }}</p>
            
            <button class="btn btn-outline-danger w-100" (click)="removeFromCart(item)">
              Избриши
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Total Price Section -->
    <div class="mt-4 p-4 bg-light rounded shadow-sm">
      <h5 class="text-end">Вкупна цена: {{ getTotalPrice() }} денари</h5>
    </div>

    <!-- Order Form Section -->
    <div class="mt-5 p-4 bg-light rounded shadow-sm">
      <h4 class="mb-4">Детали за нарачката</h4>
      <form #orderForm="ngForm" (ngSubmit)="submitOrder(orderForm)">
        <div class="mb-3">
          <label for="name" class="form-label">Име</label>
          <input type="text" class="form-control" id="name" [(ngModel)]="order.name" name="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Емаил</label>
          <input type="email" class="form-control" id="email" [(ngModel)]="order.email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Адреса</label>
          <input type="text" class="form-control" id="address" [(ngModel)]="order.address" name="address" required>
        </div>
        <div class="mb-3">
          <label for="city" class="form-label">Град</label>
          <input type="text" class="form-control" id="city" [(ngModel)]="order.city" name="city" required>
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100">Нарачај</button>
      </form>
    </div>
  </div>

  <!-- Empty Cart Message -->
  <ng-template #emptyCart>
    <div class="text-center mt-5">
      <p class="text-muted">Твојата кошничка е празна.</p>
      <a href="/" class="btn p-2" style="background-color: #d6f8cc;">Продолжи со купување.</a>
    </div>
  </ng-template>
</div>

<app-footer></app-footer>
